[package]
name = "cpu-sim"
version = "0.1.0"
edition = "2021"
description = "8-bit computer teaching simulator (Tauri shell)"
authors = ["xshow contributors"]
license = "MIT"

# Standalone crate — no outer workspace.
[workspace]

[[bin]]
name = "cpu-sim"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# VM core lives in its own crate so `cargo test -p cpu-sim-core` can run
# without pulling in the Tauri dependency tree.
cpu-sim-core = { path = "core" }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
